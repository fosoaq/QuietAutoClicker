name: Build

on:
  push:
    branches: [macos, ci]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, path: target/release/QuietAutoClicker }
          - { os: windows-latest, path: target/release/QuietAutoClicker.exe }
          - { os: macos-latest, path: dist/QuietAutoClicker.zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libx11-dev libxi-dev libxtst-dev libevdev-dev libxkbcommon-dev
      - run: rustup toolchain install stable --profile minimal --component rustfmt && rustup default stable
      - run: cargo fmt --check
      - run: cargo test --release --locked
      - run: cargo build --release --locked
      - if: runner.os == 'macOS'
        run: |
          ./scripts/bundle-macos.sh
          ditto -c -k --keepParent dist/QuietAutoClicker.app dist/QuietAutoClicker.zip
      - uses: actions/upload-artifact@v4
        with:
          name: QuietAutoClicker-${{ runner.os }}
          path: ${{ matrix.path }}
          if-no-files-found: error
